services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
    networks:
      - microservices
    depends_on:
      - api-gateway

networks:
  microservices:
    external: true
